<style>
  :root {
    --bg1: #dff3ff;
    --bg2: #fff4d6;
    --ink: #24324a;
    --muted: #5a6b86;
    --new: #2e9e5b;
    --new-dark: #1f7a43;
    --old: #f08a24;
    --old-dark: #c96b0d;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", "Comic Sans MS", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* dekorasi awan & bintang */
  .deco { position: fixed; pointer-events: none; z-index: 0; opacity: .85; }
  .cloud { width: 150px; height: 60px; background: #fff; border-radius: 60px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.04)); }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 70px; height: 70px; top: -32px; left: 22px; }
  .cloud::after  { width: 55px; height: 55px; top: -22px; left: 78px; }
  .c1 { top: 8%; left: 5%; animation: drift 14s ease-in-out infinite alternate; }
  .c2 { top: 20%; right: 6%; transform: scale(.8); animation: drift 18s ease-in-out infinite alternate-reverse; }
  .star { font-size: 32px; animation: twinkle 3s ease-in-out infinite; }
  .s1 { bottom: 12%; left: 8%; }
  .s2 { bottom: 22%; right: 10%; animation-delay: 1s; }
  .s3 { top: 45%; left: 3%; animation-delay: 2s; font-size: 24px; }
  @keyframes drift { to { transform: translateX(30px); } }
  @keyframes twinkle { 50% { transform: scale(1.25) rotate(12deg); opacity: .6; } }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 20px 24px;
    text-align: center;
  }

  .logo {
    display: block;
    margin: 0 auto;
    width: clamp(110px, 24vw, 150px);
    height: auto;
    filter: drop-shadow(0 6px 8px rgba(36, 50, 74, .25));
    animation: bob 4s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  h1 {
    margin: 18px 0 6px;
    font-size: clamp(1.9rem, 6vw, 3rem);
    line-height: 1.15;
    color: #1d4f91;
  }
  h1 span { color: #e0563b; }
  .sub {
    margin: 0 auto 28px;
    font-size: clamp(1.05rem, 3.2vw, 1.35rem);
    color: var(--muted);
    max-width: 560px;
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
  }
  @media (max-width: 640px) { .choices { grid-template-columns: 1fr; } }

  .choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #fff;
    border-radius: 28px;
    padding: 30px 22px 26px;
    transition: transform .15s ease, box-shadow .15s ease;
    border: 4px solid #fff;
  }
  .choice:focus-visible { outline: 5px solid #1d4f91; outline-offset: 4px; }
  .choice .icon {
    font-size: 4rem;
    line-height: 1;
    background: rgba(255,255,255,.25);
    width: 100px; height: 100px;
    display: grid; place-items: center;
    border-radius: 50%;
  }
  .choice .title { font-size: 1.8rem; font-weight: 800; }
  .choice .desc { font-size: 1rem; opacity: .95; min-height: 1.4em; }
  .choice .go {
    margin-top: 10px;
    background: #fff;
    font-weight: 800;
    font-size: 1.1rem;
    padding: 10px 26px;
    border-radius: 999px;
  }

  .new { background: var(--new); box-shadow: 0 8px 0 var(--new-dark); }
  .new .go { color: var(--new-dark); }
  .old { background: var(--old); box-shadow: 0 8px 0 var(--old-dark); }
  .old .go { color: var(--old-dark); }

  .choice:hover { transform: translateY(-5px); }
  .new:hover { box-shadow: 0 13px 0 var(--new-dark); }
  .old:hover { box-shadow: 0 13px 0 var(--old-dark); }
  .choice:active { transform: translateY(4px); }
  .new:active { box-shadow: 0 3px 0 var(--new-dark); }
  .old:active { box-shadow: 0 3px 0 var(--old-dark); }

  .hint {
    margin-top: 34px;
    font-size: .95rem;
    color: var(--muted);
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 16px 12px 22px;
    font-size: .85rem;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
